<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1533">
  <title>Portal DM — sem ligação</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#0b1533;font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(520px,100%);padding:30px;border:1px solid #dbe3ef;border-radius:22px;background:#fff;box-shadow:0 18px 45px rgba(15,23,42,.1);text-align:center}.logo{width:150px;max-height:90px;object-fit:contain}h1{margin:20px 0 8px;font-size:25px}p{margin:0 0 22px;color:#64748b;line-height:1.55}button{border:0;border-radius:12px;padding:12px 18px;background:#0657ff;color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="DM.png" alt="Domingos &amp; Morgado">
    <h1>Sem ligação à internet</h1>
    <p>O Portal DM precisa de ligação para consultar e atualizar os dados. Verifique a rede e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
